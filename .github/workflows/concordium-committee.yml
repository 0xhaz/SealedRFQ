name: concordium-committee

# Keep the Arc epoch registry current with Concordium's finalisation committee.
#
# The registry is fail-closed: a reward period it holds no committee for refuses every
# certificate, so every qualification stops working until someone registers one. A reward period
# is 24 hours, so this runs every six hours rather than daily — three consecutive failures can
# then pass unnoticed and the registry is still current. Daily would mean one missed run is an
# outage, and the first anyone hears of it is a supplier unable to bid.
#
# The job is safe to run when there is nothing to do: the script compares the committee already
# registered and exits without sending a transaction if it matches.

on:
  schedule:
    # 00:00, 06:00, 12:00 and 18:00 UTC. GitHub's scheduler is best-effort and can be late under
    # load, which the six-hour spacing absorbs.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Report what would happen without sending a transaction"
        type: boolean
        default: false

# Two runs registering the same period would race, and the loser wastes a fee to be told the
# period is taken. One at a time, and a scheduled run waits rather than being dropped.
concurrency:
  group: concordium-committee
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Minutes, not the default six hours: if a node stops answering, fail and say so rather than
    # holding a runner until someone notices.
    timeout-minutes: 10
    env:
      # Not secrets. These are on-chain addresses and a public RPC; keeping them in the open makes
      # the job auditable, and the only thing that actually needs protecting is the signing key.
      V2_EPOCH_REGISTRY: "0xf5c335a603193ca5CBb93b6362510d022F264EA6"
      ARC_TESTNET_RPC_URL: "https://rpc.testnet.arc.io"
      ARC_CHAIN_ID: "5042002"
      CCD_GRPC_HOST: "grpc.testnet.concordium.com"
      CCD_GRPC_PORT: "20000"
      CCD_REWARD_PERIOD_EPOCHS: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The script imports the built package, not its source.
      - run: pnpm --filter @sealedrfq/concordium build

      # Before: say plainly whether the registry was already behind, so a run that fixes an
      # outage is distinguishable in the log from one that had nothing to do.
      - name: Check whether the registry is current
        id: before
        continue-on-error: true
        run: node scripts/concordium/update-committee.mjs --check

      - name: Register the current committee
        env:
          ADMIN_PK: ${{ secrets.ARC_TESTNET_ADMIN_PK }}
        run: |
          if [ -z "$ADMIN_PK" ]; then
            echo "ARC_TESTNET_ADMIN_PK is not set in repository secrets." >&2
            exit 1
          fi
          node scripts/concordium/update-committee.mjs ${{ inputs.dryRun && '--dry-run' || '' }}

      # After: the real assertion. Registering can appear to succeed while leaving the registry
      # behind — a proposal short of its confirmations does exactly that — so the job fails unless
      # the registry is actually current at the end.
      - name: Confirm the registry is current
        if: ${{ !inputs.dryRun }}
        run: node scripts/concordium/update-committee.mjs --check
